<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Co-Teacher Tracker</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#172036;--mut:#5d6882;--line:#e0e5f0;--pri:#4f46e5;--pt:#fff;--ok:#12805c;--okb:#dcf5ea;--wn:#a45a00;--wnb:#fff0d1;--bd:#c5221f;--bdb:#fde4e3;--gr:#6b7280;--grb:#eceef3;--sc:#2563eb;--scb:#dfe9ff;--of:#9333ea;--ofb:#f1e3ff;--sh:0 2px 10px rgba(30,40,80,.08);color-scheme:light}
:root[data-theme=dark]{--bg:#0e1424;--card:#18203a;--tx:#eef1fb;--mut:#a3adc8;--line:#2a3558;--pri:#8b83ff;--pt:#0e1424;--ok:#5fe0ac;--okb:#12382d;--wn:#ffc15c;--wnb:#3d2d0c;--bd:#ff8b87;--bdb:#431a1a;--gr:#aab2c5;--grb:#262f4b;--sc:#7eaaff;--scb:#1b2a52;--of:#d3a3ff;--ofb:#35204f;--sh:0 2px 10px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#app{max-width:640px;margin:0 auto;padding:0 14px 90px}
header{display:flex;align-items:center;gap:8px;padding:14px 0;position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:1.15rem;margin:0;flex:1}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;transition:transform .08s,filter .15s}
button:active{transform:scale(.96);filter:brightness(.9)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.ib{min-width:48px;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:1.25rem}
.btn{min-height:52px;padding:0 20px;border-radius:14px;border:0;font-weight:700;background:var(--pri);color:var(--pt);width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:var(--card);color:var(--tx);border:2px solid var(--line)}
.btn.bad{background:var(--bd);color:#fff}
.btn.ok{background:var(--ok);color:var(--pt)}
.btn[disabled]{opacity:.55}
.row{display:flex;gap:10px;margin:10px 0}.row>*{flex:1}
.card{background:var(--card);border-radius:18px;padding:14px;margin:10px 0;box-shadow:var(--sh);border-left:6px solid var(--line);width:100%;text-align:left;border-top:0;border-right:0;border-bottom:0;display:block}
.card.ok{border-left-color:var(--ok)}.card.pending{border-left-color:var(--wn)}.card.issue{border-left-color:var(--bd)}.card.cancelled{border-left-color:var(--gr);opacity:.8}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top b{font-size:1.05rem}
.sub{color:var(--mut);font-size:.9rem;margin-top:4px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:700;margin-right:6px}
.b-ok{background:var(--okb);color:var(--ok)}.b-pending{background:var(--wnb);color:var(--wn)}.b-issue{background:var(--bdb);color:var(--bd)}.b-cancelled{background:var(--grb);color:var(--gr)}.b-school{background:var(--scb);color:var(--sc)}.b-office{background:var(--ofb);color:var(--of)}
.wk{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 8px;text-align:center}
.wk small{display:block;color:var(--mut)}
.bar{height:10px;border-radius:9px;background:var(--grb);margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .3s}
h2{font-size:1rem;margin:20px 0 4px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
label{display:block;font-weight:700;margin:16px 0 6px}label em{color:var(--bd);font-style:normal}
label small{font-weight:400;color:var(--mut)}
input,textarea,select{width:100%;font:inherit;color:var(--tx);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px;min-height:50px}
textarea{min-height:90px;resize:vertical}
.err input,.err textarea,.err .step{border-color:var(--bd)}
.msg{color:var(--bd);font-size:.85rem;display:none;margin-top:4px}.err .msg{display:block}
.step{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:6px;background:var(--card)}
.step b{flex:1;text-align:center;font-size:1.4rem}
.step button{width:56px;height:52px;border-radius:12px;border:0;background:var(--pri);color:var(--pt);font-size:1.6rem;font-weight:700}
.seg{display:flex;gap:8px}.seg button{flex:1;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700}
.seg button.on{border-color:var(--pri);background:var(--pri);color:var(--pt)}
.seg button.on.bad{border-color:var(--bd);background:var(--bd);color:#fff}
.kv{background:var(--card);border-radius:14px;padding:12px;margin:8px 0;border:1px solid var(--line);white-space:pre-wrap}
.kv small{display:block;color:var(--mut);font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0));max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:700;z-index:30}
.sp{width:20px;height:20px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .6s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.hero{text-align:center;padding:36px 0 10px}.hero div{font-size:3rem}
.demo{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.demo .btn{min-height:46px;flex:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}.cal span{text-align:center;font-size:.75rem;color:var(--mut);font-weight:700}.cal button{min-height:48px;border-radius:12px;border:2px solid transparent;background:var(--card);font-weight:700;position:relative;padding:0}.cal button.o{opacity:.4}.cal button.td{border-color:var(--pri)}.cal button.sel{background:var(--pri);color:var(--pt)}.cal button i{position:absolute;bottom:5px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%}.d-ok{background:var(--ok)}.d-pending{background:var(--wn)}.d-issue{background:var(--bd)}.d-cancelled{background:var(--gr)}.chip{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:99px;background:var(--scb);color:var(--sc);font-weight:700;border:0;margin:0 0 8px}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--mut)}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.fl{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}.fl button{min-height:44px;padding:0 16px;border-radius:99px;border:2px solid var(--line);background:var(--card);font-weight:700;white-space:nowrap}.fl button.on{background:var(--pri);color:var(--pt);border-color:var(--pri)}.qf{min-height:44px;padding:0 14px;border-radius:99px;border:2px solid var(--line);background:var(--card);font-weight:600;margin:8px 8px 0 0}.chk{display:flex;align-items:center;gap:12px;min-height:52px;font-weight:600;margin:10px 0}.chk input{width:26px;height:26px;min-height:0;accent-color:var(--pri)}.streak{border-left-color:#f59e0b}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1424;--card:#18203a;--tx:#eef1fb;--mut:#a3adc8;--line:#2a3558;--pri:#8b83ff;--pt:#0e1424;--ok:#5fe0ac;--okb:#12382d;--wn:#ffc15c;--wnb:#3d2d0c;--bd:#ff8b87;--bdb:#431a1a;--gr:#aab2c5;--grb:#262f4b;--sc:#7eaaff;--scb:#1b2a52;--of:#d3a3ff;--ofb:#35204f;--sh:0 2px 10px rgba(0,0,0,.4);color-scheme:dark}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import{initializeApp,deleteApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,setPersistence,browserLocalPersistence,browserSessionPersistence,createUserWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,setDoc,updateDoc,deleteField,deleteDoc,onSnapshot,query,where}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const parse=s=>{const a=s.split('-');return new Date(+a[0],a[1]-1,+a[2])};
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const monday=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+1)%7));return iso(x)};
const fmt=s=>parse(s).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const TYPE={school:'School',office:'Office hours'};
const ld=(k,f)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const TW=monday(new Date());
const firebaseConfig={apiKey:"AIzaSyA0fjW-z9oSNejH8uFtIXakm21Y8prGm7s",authDomain:"co-teachers.firebaseapp.com",projectId:"co-teachers",storageBucket:"co-teachers.firebasestorage.app",messagingSenderId:"65170864346",appId:"1:65170864346:web:789921ee362f3824f24de3"};
const fbApp=initializeApp(firebaseConfig),auth=getAuth(fbApp),fs=getFirestore(fbApp);
let db={teachers:[],tpl:[],one:[],sess:{},schools:[]},ready=false,authReady=false,unsubs=[];
const LOAD='<div class="hero"><div>📚</div><p class="sub">Loading…</p></div>';
const rr=()=>{if(v.s==='form'||m)return;render()};
const tidOf=key=>{const id=key.split('|')[0];return(db.tpl.find(p=>p.id===id)||db.one.find(o=>o.id===id)||{}).tid};
const saveS=key=>{const r=db.sess[key];r.tid=tidOf(key);return setDoc(doc(fs,'sess',key),r).catch(e=>{console.error(e);toast('Could not save. Check your connection')})};
function listen(){
 unsubs.forEach(u=>u());unsubs=[];ready=false;let n=0;const adm=me.role==='admin',need=adm?5:4;
 const sub=(q,fn)=>{let first=true;unsubs.push(onSnapshot(q,x=>{fn(x);if(first){first=false;if(++n===need)ready=true}rr()},e=>{console.error(e);toast('Connection problem')}))};
 const own=where('tid','==',me.id),L=x=>x.docs.map(d=>Object.assign({id:d.id},d.data()));
 sub(collection(fs,'schools'),x=>{db.schools=L(x)});
 sub(adm?collection(fs,'tpl'):query(collection(fs,'tpl'),own),x=>{db.tpl=L(x)});
 sub(adm?collection(fs,'one'):query(collection(fs,'one'),own),x=>{db.one=L(x)});
 sub(adm?collection(fs,'sess'):query(collection(fs,'sess'),own),x=>{db.sess={};x.docs.forEach(d=>{db.sess[d.id]=d.data()})});
 if(adm)sub(query(collection(fs,'users'),where('role','==','coteacher')),x=>{db.teachers=L(x)});
 else db.teachers=[{id:me.id,name:me.name,email:me.email}];
}
let me=null,ws=TW,v={s:'home'},m=null,draft=null,busy=false,day=null,fold=null,flt='all',cm=TW.slice(0,8)+'01';
let theme=ld('ct_theme',null);
const applyTheme=()=>{if(theme)document.documentElement.setAttribute('data-theme',theme);else document.documentElement.removeAttribute('data-theme')};
applyTheme();
const isDark=()=>theme?theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
const tname=id=>(db.teachers.find(t=>t.id===id)||{}).name||'';

function sessions(tid,w){
 const out=[];
 db.tpl.filter(p=>p.tid===tid).forEach(p=>{const date=addD(w,(p.day+2)%7),fr=p.from||(/^p\d{12,}$/.test(p.id)?iso(new Date(+p.id.slice(1))):'');if((fr&&date<fr)||(p.until&&date>p.until))return;out.push({key:p.id+'|'+date,tpl:p,date,time:p.time,type:p.type,title:p.title,tid,school:p.type==='office'?'office':(p.school||'s1')})});
 db.one.filter(o=>o.tid===tid&&o.date>=w&&o.date<=addD(w,6)).forEach(o=>out.push({key:o.id+'|'+o.date,one:true,date:o.date,time:o.time,type:o.type,title:o.title,tid,school:o.type==='office'?'office':(o.school||'s1')}));
 out.forEach(s=>{const r=db.sess[s.key]||{};if(r.ov)Object.assign(s,r.ov);s.rec=r;s.paused=s.tpl&&s.tpl.pauseUntil&&s.date<=s.tpl.pauseUntil;s.reason=r.reason||(s.paused?'Paused until '+fmt(s.tpl.pauseUntil):'');
 s.status=(r.cancelled||s.paused)?'cancelled':r.report?(r.report.issue&&!r.resolved?'issue':'ok'):'pending';s.over=s.status==='pending'&&new Date(s.date+'T'+s.time).getTime()+288e5<Date.now();s.closed=s.status==='pending'&&new Date(s.date+'T'+s.time).getTime()+1728e5<Date.now()&&(r.unlockUntil||0)<Date.now();s.unl=(r.unlockUntil||0)>Date.now()});
 return out.filter(s=>!s.rec.deleted).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}
const find=key=>{const w=monday(parse(key.split('|')[1]));for(const t of db.teachers){const s=sessions(t.id,w).find(x=>x.key===key);if(s)return s}};
const LBL={ok:'Done',pending:'Pending',issue:'Issue',cancelled:'Cancelled'};
const typeB=t=>`<span class="badge b-${t}">${TYPE[t]}</span>`;

const schName=id=>id==='office'?'Office hours':((db.schools.find(x=>x.id===id)||{}).name||'');
const schCol=id=>id==='office'?'var(--of)':((db.schools.find(x=>x.id===id)||{}).color||'var(--sc)');
const FL=[['all','All'],['pending','Pending'],['ok','Done'],['issue','Issues'],['cancelled','Cancelled']];
const chips=()=>`<div class="fl">${FL.map(f=>`<button class="${flt===f[0]?'on':''}" data-a="fl" data-f="${f[0]}">${f[1]}</button>`).join('')}</div>`;
const qf=(f,t)=>`<button class="qf" data-a="qf" data-f="${f}" data-t="${esc(t)}">${esc(t)}</button>`;
const folderCard=(id,l)=>{const act=l.filter(s=>s.status!=='cancelled'),d=act.filter(s=>s.status==='ok'||s.status==='issue').length,iss=l.filter(s=>s.status==='issue').length,ov=l.filter(s=>s.over).length;return `<button class="card" style="border-left-color:${schCol(id)}" data-a="fold" data-id="${id}"><div class="top"><b>📁 ${esc(schName(id))}</b><span class="sub">${d}/${act.length} reports</span></div><div class="bar"><i style="width:${act.length?d/act.length*100:0}%"></i></div><div style="margin-top:8px">${iss?`<span class="badge b-issue">⚠ ${iss} issue</span>`:''}${ov?`<span class="badge b-issue">⏰ ${ov} missing</span>`:''}</div></button>`};
const attn=()=>{let o=[];for(let i=0;i<4;i++)db.teachers.forEach(t=>sessions(t.id,addD(TW,-7*i)).forEach(s=>{if(s.status==='issue'||s.over)o.push(s)}));return o.sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time))};
const mine=()=>{let o=[];for(let i=0;i<4;i++)sessions(me.id,addD(TW,-7*i)).forEach(s=>{if(s.over)o.push(s)});return o};
function list(tid){const ss=sessions(tid,ws),g={};ss.forEach(s=>(g[s.school]=g[s.school]||[]).push(s));const ids=Object.keys(g),multi=ids.length>1;
 if(!day&&multi&&!fold)return ids.map(id=>folderCard(id,g[id])).join('');
 const l=ss.filter(s=>day?s.date===day:(multi&&fold?s.school===fold:true)).filter(s=>flt==='all'||s.status===flt);
 let h=(!day&&multi&&fold?`<button class="chip" data-a="unfold">← All folders · ${esc(schName(fold))}</button>`:'')+chips(),last='';
 l.forEach(s=>{if(s.date!==last){last=s.date;h+=`<h2>${s.date===iso(new Date())?'Today · ':''}${DAYS[(parse(s.date).getDay()+6)%7]} ${fmt(s.date)}</h2>`}h+=card(s)});
 return h+(l.length?'':'<p class="sub">No sessions here.</p>')}
const DUE=288e5,CUT=1728e5;
const canEdit=s=>{const r=s.rec.report,n=Date.now();if((s.rec.unlockUntil||0)>n)return true;if(r)return!(r.at&&n-r.at>864e5);return n<=new Date(s.date+'T'+s.time).getTime()+CUT};
const hm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const bdg=s=>s.unl&&s.status==='pending'?'<span class="badge b-ok">🔓 Unlocked</span>':s.closed?'<span class="badge b-issue">🔒 Closed</span>':s.over?'<span class="badge b-issue">⏰ Report missing</span>':'<span class="badge b-'+s.status+'">'+LBL[s.status]+'</span>';
function streak(tid){
 const ds={},today=iso(new Date()),now=Date.now();
 for(let w=addD(TW,-182);w<=TW;w=addD(w,7))sessions(tid,w).forEach(s=>{if(s.status==='cancelled'||s.date>today)return;(ds[s.date]=ds[s.date]||[]).push(s)});
 const st=Object.keys(ds).sort().map(d=>{let bad=false,open=false;ds[d].forEach(s=>{const r=s.rec.report,t0=new Date(s.date+'T'+s.time).getTime();if(r){if(r.at&&r.at>t0+DUE)bad=true}else if(now>t0+DUE)bad=true;else open=true});return bad?'b':open?'o':'k'});
 let cur=0,best=0,run=0;
 st.forEach(x=>{if(x==='k'){run++;best=Math.max(best,run)}else if(x==='b')run=0});
 for(let i=st.length-1;i>=0;i--){if(st[i]==='o')continue;if(st[i]==='b')break;cur++}
 return{cur,best}}
const TIERS=[[30,'💎','Platinum'],[20,'🥇','Gold'],[10,'🥉','Bronze']];
const tierOf=n=>{const t=TIERS.find(x=>n>=x[0]);return t?{ic:t[1],nm:t[2],stars:n>=30?Math.floor((n-30)/10):0}:null};
const stk=tid=>{const x=streak(tid),t=tierOf(x.cur);return '🔥 '+x.cur+(t?' '+t.ic+' '+t.nm+'⭐'.repeat(t.stars):'')};
function streakCard(tid){const x=streak(tid),t=tierOf(x.cur),n=x.cur%10,left=10-n,g=x.cur<10?'🥉 Bronze':x.cur<20?'🥇 Gold':x.cur<30?'💎 Platinum':'⭐ the next star';
 return `<div class="card streak"><div class="top"><div><b style="font-size:1.7rem">🔥 ${x.cur}</b> <span class="sub">session day${x.cur===1?'':'s'} in a row</span></div>${t?`<span class="badge b-ok" style="font-size:.9rem;margin:0">${t.ic} ${t.nm}${'⭐'.repeat(t.stars)}</span>`:''}</div><div class="bar"><i style="width:${n*10}%;background:#f59e0b"></i></div><div class="sub">${left} more day${left===1?'':'s'} to ${g} · Best streak: ${x.best}</div><div class="sub" style="font-size:.78rem">Only days with sessions count. Submit each report within 8 hours of the session start.</div></div>`}
const calPanel=()=>{if(me.role!=='admin'||!m.sel)return'<p class="sub" style="margin:10px 0 0">Tap a day to open it'+(me.role==='admin'?' or to cancel its sessions':'')+'.</p>';
 const L=daySess(m.sel),act=L.filter(s=>s.status!=='cancelled'),rc=L.filter(s=>s.rec.cancelled).length,nm=v.s==='teacher'?tname(v.id):'All co-teachers';
 return `<div class="kv" style="margin-top:12px"><small>${DAYS[(parse(m.sel).getDay()+6)%7]} ${fmt(m.sel)} · ${esc(nm)}</small>${L.length?L.length+' session'+(L.length>1?'s':'')+' ('+act.length+' active)':'No sessions on this day'}</div>${L.length?'<button class="btn sec" data-a="viewday">👁 View this day</button><div style="height:10px"></div>':''}${act.length?`<label for="dr">Reason <small>(optional)</small></label><input id="dr" placeholder="Holiday, exam…"><div style="height:10px"></div><button class="btn bad" data-a="cancelDay">🚫 Cancel all ${act.length} session${act.length>1?'s':''}</button><div style="height:10px"></div>`:''}${rc?`<button class="btn ok" data-a="restoreDay">↩ Restore the ${rc} cancelled</button><div style="height:10px"></div>`:''}`};
const dName=d=>DAYS[(parse(d).getDay()+6)%7];
const stTxt=s=>s.status==='cancelled'?'Cancelled'+(s.reason?' – '+s.reason:''):s.status==='ok'?'Done':s.status==='issue'?'Done – issue open':s.closed?'Missing (closed)':s.over?'Missing':'Pending';
const EXH=['Day / date','Time','Session','School','Type','Status','Recapped on','Questions solved','Attendance','Issue','Issue severity / status','Admin reply'];
const EXW=[16,8,20,18,13,22,38,34,22,32,20,30];

 if(m.t==='edit'){const s=find(m.k);if(s){b=`<h2 style="margin-top:0">Edit session</h2>${s.one?'':'<p class="sub">Changes apply to this session and all future weeks.</p>'}<label for="et">Title</label><input id="et" value="${esc(s.title)}"><label>Type</label><div class="seg"><button class="${m.type==='school'?'on':''}" data-a="etype" data-s="school">🏫 School</button><button class="${m.type==='office'?'on':''}" data-a="etype" data-s="office">🕐 Office hours</button></div>${m.type==='school'?`<label for="es2">School</label><select id="es2">${db.schools.map(x=>`<option value="${x.id}"${x.id===s.school?' selected':''}>${esc(x.name)}</option>`).join('')}</select>`:''}${s.one?`<label for="ed">Date</label><input id="ed" type="date" value="${s.date}">`:''}<label for="etm">Time</label><input id="etm" type="time" value="${s.time}"><div class="row"><button class="btn sec" data-a="x">Back</button><button class="btn" data-a="doEdit">Save changes</button></div>`}}
 if(m.t==='del'){const s=find(m.k);b=s&&s.one?`<h2 style="margin-top:0">Delete this session?</h2><p class="sub">It will be removed for good, together with its report.</p><div class="row"><button class="btn sec" data-a="x">Keep it</button><button class="btn bad" data-a="delOne">Delete</button></div>`:`<h2 style="margin-top:0">Delete weekly session</h2><p class="sub">Choose what to remove. Other weeks and their reports are kept.</p><button class="btn bad" data-a="delOne">Only this session</button><div style="height:10px"></div><button class="btn bad" data-a="delFut">This and all future weeks</button><div style="height:10px"></div><button class="btn sec" data-a="x">Keep it</button>`}
 if(m.t==='addSc')b=`<h2 style="margin-top:0">New school</h2><label for="scn">School name</label><input id="scn"><label for="scc">Folder colour</label><input id="scc" type="color" value="#2563eb"><div class="row"><button class="btn sec" data-a="x">Back</button><button class="btn" data-a="doAddSc">Add school</button></div>`;
 if(m.t==='addT')b=`<h2 style="margin-top:0">New co-teacher</h2><label for="nn">Name</label><input id="nn"><label for="ne">Email</label><input id="ne" type="email"><label for="np">Password</label><input id="np" type="text"><div class="row"><button class="btn sec" data-a="x">Back</button><button class="btn" data-a="doAddT">Add</button></div>`;
 if(m.t==='addS')b=`<h2 style="margin-top:0">New one-off session</h2><label for="ct">Co-teacher</label><select id="ct">${db.teachers.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select>
 <label>Type</label><div class="seg"><button class="${m.type==='school'?'on':''}" data-a="mt" data-s="school">🏫 School</button><button class="${m.type==='office'?'on':''}" data-a="mt" data-s="office">🕐 Office hours</button></div>
 ${m.type==='school'?`<label for="ssc">School</label><select id="ssc">${db.schools.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>`:''}<label>Repeat</label><div class="seg"><button class="${m.rep?'':'on'}" data-a="rep" data-s="0">One time</button><button class="${m.rep?'on':''}" data-a="rep" data-s="1">Every week</button></div><label for="sd">Date</label><input id="sd" type="date" min="${iso(new Date())}" value="${ws>iso(new Date())?ws:iso(new Date())}"><label for="stm">Time</label><input id="stm" type="time" value="10:00"><label for="stt">Title</label><input id="stt" placeholder="Optional">
 <div class="row"><button class="btn sec" data-a="x">Back</button><button class="btn" data-a="doAddS">Add session</button></div>`;
 return `<div class="ov" data-a="x"><div class="sheet">${b}</div></div>`}

function render(){const sy=window.scrollY;$('#app').innerHTML=view()+modal();window.scrollTo(0,sy)}

const val=id=>($('#'+id)||{}).value||'';

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,k=el.dataset.k;
 if(a==='x'){if(e.target.closest('.sheet')&&el.classList.contains('ov'))return;m=null;return render()}

 if(a==='back'){if(v.s==='form')return go('session',{key:v.key});if(v.s==='session')return go(me.role==='admin'&&v.tid?'teacher':'home',{id:v.tid});fold=null;return go('home')}

 if(a==='cal'){cm=(day||ws).slice(0,8)+'01';m={t:'cal'};return render()}
 if(a==='cm'){const d=parse(cm);d.setMonth(d.getMonth()+(+el.dataset.d));cm=iso(d);return render()}
 if(a==='pick'){const d=el.dataset.d;if(me.role==='admin'){m.sel=d;return render()}day=d;ws=monday(parse(d));m=null;return render()}
 if(a==='today'){day=iso(new Date());ws=TW;m=null;return render()}
 if(a==='allweek'){day=null;return render()}
 if(a==='edit'){const s=find(k);m={t:'edit',k,type:s.type,scope:'fut'};return render()}
 if(a==='etype'||a==='escope'){if(a==='etype')m.type=el.dataset.s;else m.scope=el.dataset.s;const I=['et','etm','ed','es2'],keep=I.map(val);render();I.forEach((i,x)=>{const n=$('#'+i);if(n&&keep[x])n.value=keep[x]});return}
 if(a==='doEdit'){const key=m.k,s=find(key);if(!s){m=null;return render()}const id=key.split('|')[0],type=m.type,time=val('etm'),title=val('et').trim()||TYPE[type],school=type==='school'?(val('es2')||s.school):'office';
  if(!time){toast('Pick a time');return}
  if(s.one){const nd=val('ed');if(!nd){toast('Pick a date');return}updateDoc(doc(fs,'one',id),{title,time,type,school,date:nd});
   if(nd!==s.date&&db.sess[key]){const c=Object.assign({},db.sess[key],{tid:s.tid});setDoc(doc(fs,'sess',id+'|'+nd),c);deleteDoc(doc(fs,'sess',key))}}
  else{const p=s.tpl,nid='p'+Date.now(),n={tid:p.tid,day:p.day,time,type,title,school,from:s.date};if(p.pauseUntil)n.pauseUntil=p.pauseUntil;
   updateDoc(doc(fs,'tpl',p.id),{until:addD(s.date,-1)});setDoc(doc(fs,'tpl',nid),n);
   Object.keys(db.sess).filter(k=>k.startsWith(p.id+'|')&&k.split('|')[1]>=s.date).forEach(k=>{const c=Object.assign({},db.sess[k],{tid:p.tid});delete c.ov;setDoc(doc(fs,'sess',nid+'|'+k.split('|')[1]),c);deleteDoc(doc(fs,'sess',k))})}
  m=null;toast('Session updated');return go('teacher',{id:v.tid})}
 if(a==='exp'){m={t:'exp'};return render()}
  if(a==='expXls'){el.disabled=true;toast('Preparing the file…');expXlsx().then(()=>{m=null;render();toast('Excel file downloaded')}).catch(e=>{console.error(e);try{expCsv();toast('Downloaded as CSV instead')}catch(_){toast('Export failed')}m=null;render()});return}
 if(a==='expPdf'){expPdf();m=null;render();return}
 if(a==='unlock'){const r=db.sess[k]||(db.sess[k]={});r.unlockUntil=Date.now()+72e5;saveS(k);render();return toast('Unlocked for 2 hours')}
 if(a==='viewday'){day=m.sel;ws=monday(parse(day));m=null;return render()}
 if(a==='cancelDay'){const rs=val('dr').trim(),L=daySess(m.sel).filter(x=>x.status!=='cancelled');L.forEach(x=>{const r=db.sess[x.key]||(db.sess[x.key]={});r.cancelled=true;r.reason=rs;saveS(x.key)});render();return toast(L.length+' session'+(L.length===1?'':'s')+' cancelled')}
 if(a==='restoreDay'){const L=daySess(m.sel).filter(x=>x.rec.cancelled);L.forEach(x=>{const r=db.sess[x.key];delete r.cancelled;delete r.reason;saveS(x.key)});render();return toast(L.length+' session'+(L.length===1?'':'s')+' restored')}
 if(a==='del'){m={t:'del',k};return render()}
 if(a==='delOne'){const key=m.k,s=find(key);if(s&&s.one){deleteDoc(doc(fs,'one',key.split('|')[0]));deleteDoc(doc(fs,'sess',key))}else{const r=db.sess[key]||(db.sess[key]={});r.deleted=true;saveS(key)}m=null;toast('Session deleted');return go('teacher',{id:v.tid})}
 if(a==='delFut'){const key=m.k;updateDoc(doc(fs,'tpl',key.split('|')[0]),{until:addD(key.split('|')[1],-1)});m=null;toast('Weekly session removed');return go('teacher',{id:v.tid})}
 if(a==='fl'){flt=el.dataset.f;return render()}
 if(a==='fold'){fold=el.dataset.id;return render()}
 if(a==='unfold'){fold=null;return render()}
 if(a==='qf'){const f=el.dataset.f;draft[f]=(draft[f]?draft[f]+(draft[f].endsWith(' ')?'':'. '):'')+el.dataset.t;return render()}
 if(a==='copyprev'){const p=draft.prev;draft.recap=p.recap||'';draft.solved=String(p.solved==null?'':p.solved);draft.att=p.att||(p.present+' of '+p.total);return render()}
 if(a==='addSc'){m={t:'addSc'};return render()}
 if(a==='doAddSc'){const n=val('scn').trim();if(!n){toast('Enter the school name');return}setDoc(doc(fs,'schools','s'+Date.now()),{name:n,color:val('scc')});m=null;render();return toast('School added')}
 if(a==='reply'){const t=val('rp').trim();if(!t){toast('Write a reply first');return}(db.sess[k]||(db.sess[k]={})).reply={text:t,at:Date.now()};saveS(k);render();return toast('Reply sent')}

  if(a==='login'){const em=val('em').trim(),pw=val('pw');$('#le').style.display='none';if(!em||!pw){$('#le').style.display='block';return}el.disabled=true;setPersistence(auth,$('#rm').checked?browserLocalPersistence:browserSessionPersistence).then(()=>signInWithEmailAndPassword(auth,em,pw)).catch(()=>{el.disabled=false;$('#le').style.display='block'});return}
 if(a==='teacher'){fold=null;flt='all';return go('teacher',{id:el.dataset.id})}
 if(a==='open'){const s=find(k);return go('session',{key:k,tid:s.tid})}
 if(a==='cancel'){m={t:'cancel',k};return render()}
 if(a==='doCancel'){const r=db.sess[m.k]||(db.sess[m.k]={});r.cancelled=true;r.reason=val('rs').trim();saveS(m.k);m=null;render();return toast('Session cancelled')}
 if(a==='restore'){const r=db.sess[k]||{};delete r.cancelled;delete r.reason;db.sess[k]=r;saveS(k);render();return toast('Session restored')}

 if(a==='addT'){m={t:'addT'};return render()}
 if(a==='doAddT'){const n=val('nn').trim(),em=val('ne').trim(),pw=val('np');if(!n||!em||pw.length<6){toast('Fill name, email and a 6+ character password');return}el.disabled=true;
 (async()=>{try{const sec=initializeApp(firebaseConfig,'sec'+Date.now()),sa=getAuth(sec),c=await createUserWithEmailAndPassword(sa,em,pw);await setDoc(doc(fs,'users',c.user.uid),{role:'coteacher',name:n,email:em});await signOut(sa);await deleteApp(sec);m=null;render();toast('Co-teacher added')}catch(e){el.disabled=false;toast(e.code==='auth/email-already-in-use'?'That email is already used':'Could not add co-teacher')}})();return}
 if(a==='addS'){m={t:'addS',type:'school'};return render()}
 if(a==='mt'||a==='rep'){if(a==='mt')m.type=el.dataset.s;else m.rep=el.dataset.s==='1';const I=['ct','sd','stm','stt','ssc'],keep=I.map(val);render();I.forEach((i,x)=>{const n=$('#'+i);if(n&&keep[x])n.value=keep[x]});return}
 if(a==='doAddS'){const d=val('sd'),tm=val('stm');if(!d||!tm){toast('Pick a date and time');return}if(d<iso(new Date())){toast('Pick today or a future date');return}const oid=(m.rep?'p':'o')+Date.now(),o={tid:val('ct'),time:tm,type:m.type,title:val('stt').trim()||TYPE[m.type],school:m.type==='school'?val('ssc'):'office'};if(m.rep){o.day=(parse(d).getDay()+6)%7;o.from=iso(new Date());setDoc(doc(fs,'tpl',oid),o)}else{o.date=d;setDoc(doc(fs,'one',oid),o)}m=null;render();return toast('Session added')}
 if(a==='fill'){const s=find(k),r=s.rec.report||{};if(!canEdit(s)){toast('This report is locked');return}draft={recap:r.recap||'',solved:r.solved==null?'':String(r.solved),att:r.att||(r.present!=null?r.present+' of '+r.total:''),issue:r.issue||'',sev:r.sev||'minor',tried:false,prev:s.rec.report?null:((db.sess[k.split('|')[0]+'|'+addD(s.date,-7)]||{}).report||null)};return go('form',{key:k,tid:s.tid})}
 if(a==='st'){const f=el.dataset.f,d=+el.dataset.d;let x=draft[f]==null?(d>0?0:0):draft[f]+d;if(draft[f]==null&&d>0)x=f==='present'?1:1;x=Math.max(0,x);if(f==='present'&&x>draft.total)x=draft.total;draft[f]=x;if(f==='total'&&draft.present>x)draft.present=x;return render()}
 if(a==='sev'){draft.sev=el.dataset.s;return render()}
 if(a==='submit'){draft.tried=true;{const s0=find(v.key);if(!s0||!canEdit(s0)){toast('This report is now locked. Ask the admin to unlock it.');return go('session',{key:v.key,tid:v.tid})}}if(!draft.recap.trim()||!draft.solved.trim()||!draft.att.trim()){render();const b=$('.err');if(b)b.scrollIntoView({block:'center',behavior:'smooth'});return toast('Please fill the required fields')}
  busy=true;render();setTimeout(()=>{busy=false;const r=db.sess[v.key]||(db.sess[v.key]={});r.report={recap:draft.recap.trim(),solved:draft.solved.trim(),att:draft.att.trim(),at:(r.report&&r.report.at)||Date.now(),issue:draft.issue.trim(),sev:draft.issue.trim()?draft.sev:''};saveS(v.key);go('session',{key:v.key,tid:v.tid});toast('Report submitted ✓')},450)}
});

onAuthStateChanged(auth,async u=>{
 unsubs.forEach(x=>x());unsubs=[];ready=false;
 if(!u){me=null;authReady=true;v={s:'home'};return render()}
 try{const p=await getDoc(doc(fs,'users',u.uid));
  if(!p.exists()){toast('This account has no profile. Ask the admin.');await signOut(auth);return}
  me={role:p.data().role,id:u.uid,name:p.data().name||'',email:u.email};v={s:'home'};listen()}
 catch(e){console.error(e);toast('Could not load your profile');me=null}
